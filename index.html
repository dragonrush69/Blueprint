<!-- Blueprint Stack Calculator v14 — 2026-09-27 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Blueprint — Stack Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600;700&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f8fafc; font-family: 'DM Sans', sans-serif; -webkit-text-size-adjust: 100%; }
    #root { min-height: 100%; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js?v=13"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js?v=13"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js?v=13"></script>

<script type="text/babel">
const { useState } = React;

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const STACK_URL = "https://script.google.com/macros/s/AKfycbzuFNRBcBWmGjqDBP_WBoMuOHPZN3qkkKH67_DhCtYR7zSlj-fmhHSJkAoMH6hG6X39/exec";
const stackEnabled = () => STACK_URL && !STACK_URL.startsWith("YOUR_");

// ─── HARDCODED ROSTER ─────────────────────────────────────────────────────────
const ROSTER = {
  MERCS: [
    "Grim Stalker Leader","Wasp-Man Leader","Highlander","Slavic warrior",
    "Pounder","Scarface","Chitinous Defnder Leader","Combat Anreater Leader",
    "Quicksand","Galloper","Superior Epic Monster Hunter","Elder Frozen Warden",
    "Elder Bounty Hunter","Ariel","Warregal","Jago",
    "Demonic Salamander","Eternal Cannoneer","Warden","Wyvern",
  ],
  G9: ["Punisher II","Purifier II","Smiter II","Corax II"],
  G8: ["Punisher I","Purifier I","Smiter I","Corax I"],
  S9: ["Duelist II","Legitimist II","Whitemane II","Royal Lion II"],
  S8: ["Duelist I","Legitimist I","Whitemain I","Royal Lion I"],
  E9: ["Cannon II"],
  E8: ["Cannon I"],
  M9: ["Trickster II","Fire Phoenix II","Kraken II","Devastator II"],
  M8: ["Trickster I","Devastator I","Fire Phoenix I","Kraken I"],
  M7: ["Ancient Terror","Black Dragon","Destructive Colossus","Wind Lord"],
};

// Pairs shown side-by-side; solo tiers are full width
const TIER_PAIRS = [["G9","G8"],["S9","S8"],["E9","E8"],["M9","M8"],["M7"]];

// Flat ordered tier list for results display
const TIER_ORDER = ["G9","G8","S9","S8","E9","E8","M9","M8","M7"];

// ─── TIER STYLES — monochrome ─────────────────────────────────────────────────
const DARK   = "#1e293b";
const ACCENT = "#334155";
const MONO   = { color:DARK, bg:"#f1f5f9", border:"#cbd5e1", activeColor:DARK, activeBg:"#e2e8f0", activeBorder:"#64748b" };
const TIER_MAP = Object.fromEntries(TIER_ORDER.map(k => [k, MONO]));

// ─── ICONS ────────────────────────────────────────────────────────────────────
const Icon = ({ name, size=22, color="currentColor" }) => {
  const s = { width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:color, strokeWidth:"2", strokeLinecap:"round", strokeLinejoin:"round" };
  const icons = {
    calc:      <svg {...s}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>,
    copy:      <svg {...s}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
    download:  <svg {...s}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    user:      <svg {...s}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    blueprint: <svg {...s}><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/></svg>,
  };
  return icons[name] || null;
};

const SecHeader = ({ title, action }) => (
  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
    <span style={{ fontSize:12, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.08em" }}>{title}</span>
    {action}
  </div>
);

const ToggleSwitch = ({ on, onClick }) => (
  <button onClick={onClick} style={{ width:36, height:20, borderRadius:10, border:"none", cursor:"pointer", flexShrink:0, backgroundColor: on ? DARK : "#cbd5e1", position:"relative", padding:0, transition:"background 0.15s" }}>
    <div style={{ width:14, height:14, borderRadius:7, backgroundColor:"#fff", position:"absolute", top:3, left: on ? 19 : 3, transition:"left 0.15s", boxShadow:"0 1px 2px rgba(0,0,0,0.2)" }}/>
  </button>
);

const TroopCheck = ({ on, onClick }) => (
  <button onClick={onClick} style={{ width:20, height:20, borderRadius:5, flexShrink:0, cursor:"pointer", border:`2px solid ${on ? DARK : "#cbd5e1"}`, backgroundColor: on ? "#e2e8f0" : "#f8fafc", display:"flex", alignItems:"center", justifyContent:"center" }}>
    {on && <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke={DARK} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
  </button>
);

// ─── STACK CALCULATOR ─────────────────────────────────────────────────────────
const StackCalcScreen = () => {
  const [lad,      setLad]      = useState({ leadership:"", authority:"", dominance:"" });
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);
  const [copied,   setCopied]   = useState(false);
  const [troopQty,    setTroopQty]    = useState({});
  const [resultOrder, setResultOrder] = useState({ mercs:[], guards:[], monsters:[] });

  const [tierOn,   setTierOn]   = useState(() => Object.fromEntries(TIER_ORDER.map(k => [k, true])));
  const [troopOn,  setTroopOn]  = useState(() => Object.fromEntries([...Object.values(ROSTER).flat()].map(n => [n, true])));
  const [expanded, setExpanded] = useState({});

  const [email, setEmail] = useState(() => {
    try { return localStorage.getItem("blueprint_stack_email") || ""; } catch { return ""; }
  });

  const calculated = Object.keys(troopQty).length > 0;

  // ── Toggles ──
  const toggleTier = (key) => {
    const newVal = !tierOn[key];
    setTierOn(t => ({ ...t, [key]: newVal }));
    setTroopOn(tr => {
      const next = { ...tr };
      (ROSTER[key] || []).forEach(n => { next[n] = newVal; });
      return next;
    });
  };
  const toggleTroop  = (name) => setTroopOn(tr => ({ ...tr, [name]: !tr[name] }));
  const toggleExpand = (key)  => setExpanded(e  => ({ ...e,  [key]: !e[key] }));

  // ── Calculate ──
  const calculate = async () => {
    if (!stackEnabled()) return;
    setLoading(true);
    setError(null);
    try {
      // Build includes: troop name → true/false based on tier + individual toggles
      const includes = {};
      ROSTER.MERCS.forEach(name => { includes[name] = troopOn[name] !== false; });
      TIER_ORDER.forEach(tier => {
        (ROSTER[tier] || []).forEach(name => {
          includes[name] = (tierOn[tier] !== false) && (troopOn[name] !== false);
        });
      });

      const res = await fetch(STACK_URL, {
        method:"POST", headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({
          leadership: Number(lad.leadership) || 0,
          authority:  Number(lad.authority)  || 0,
          dominance:  Number(lad.dominance)  || 0,
          includes,
        }),
        redirect:"follow",
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      // Normalise names from API (sheet may have double-spaces e.g. "Punisher  II")
      const norm = arr => (arr || []).map(t => ({ ...t, name: (t.name||"").replace(/\s+/g," ").trim() }));
      const mercs    = norm(data.stack?.mercs);
      const guards   = norm(data.stack?.guards);
      const monsters = norm(data.stack?.monsters);
      const qty = {};
      [...mercs, ...guards, ...monsters].forEach(t => { qty[t.name] = t.qty; });
      console.log("guards from API:", JSON.stringify(guards.slice(0,3)));
      console.log("monsters from API:", JSON.stringify(monsters.slice(0,3)));
      setTroopQty(qty);
      setResultOrder({ mercs, guards, monsters });
      requestAnimationFrame(() => window.scrollTo({ top:0, behavior:"smooth" }));
    } catch (err) {
      setError(err.message || "Could not reach the calculator.");
    } finally {
      setLoading(false);
    }
  };

  // ── Copy (only active troops with qty > 0) ──
  const copyToClipboard = () => {
    const lines = [];
    const em = ROSTER.MERCS.filter(n => troopOn[n] && troopQty[n] > 0);
    if (em.length) { lines.push("MERCS"); em.forEach(n => lines.push(`  ${n}: ${troopQty[n].toLocaleString()}`)); }
    TIER_ORDER.forEach(key => {
      const et = (ROSTER[key]||[]).filter(n => tierOn[key] && troopOn[n] && troopQty[n] > 0);
      if (et.length) { lines.push(key); et.forEach(n => lines.push(`  ${n}: ${troopQty[n].toLocaleString()}`)); }
    });
    const text = lines.join("\n");
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2500); };
    if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(done); }
    else { const el=document.createElement("textarea"); el.value=text; document.body.appendChild(el); el.select(); document.execCommand("copy"); document.body.removeChild(el); done(); }
  };

  // ── Download CSV ──
  const downloadCSV = () => {
    const rows = [["Group","Name","Quantity"]];
    ROSTER.MERCS.forEach(n => rows.push(["Mercs", n, troopOn[n] ? (troopQty[n]||0) : 0]));
    TIER_ORDER.forEach(key => (ROSTER[key]||[]).forEach(n => rows.push([key, n, (tierOn[key] && troopOn[n]) ? (troopQty[n]||0) : 0])));
    const csv=rows.map(r=>r.join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=`stack_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  // ── Email ──
  const saveEmail = v => { setEmail(v); try { localStorage.setItem("blueprint_stack_email", v); } catch {} };
  const openEmail = () => {
    const lines = [];
    ROSTER.MERCS.forEach(n => lines.push(`${n}: ${troopOn[n] ? (troopQty[n]||0) : 0}`));
    TIER_ORDER.forEach(key => (ROSTER[key]||[]).forEach(n => lines.push(`[${key}] ${n}: ${(tierOn[key]&&troopOn[n]) ? (troopQty[n]||0) : 0}`)));
    const subject=encodeURIComponent(`Stack Calculator Results — ${new Date().toLocaleDateString()}`);
    window.location.href=`mailto:${encodeURIComponent(email.trim())}?subject=${subject}&body=${encodeURIComponent(lines.join("\n"))}`;
  };

  // ── LAD field ──
  const ladField = (key, label) => (
    <div key={key} style={{ flex:1 }}>
      <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:4 }}>{label}</div>
      <input type="number" inputMode="numeric" placeholder="0" value={lad[key]}
        onChange={e => setLad(l => ({ ...l, [key]: e.target.value }))}
        style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e2e8f0", borderRadius:10, fontSize:15, fontWeight:600, fontFamily:"'DM Mono',monospace", color:"#1e293b", backgroundColor:"#fff", textAlign:"right" }}
      />
    </div>
  );

  // ── Reusable collapsible section (tiers + mercs) ──
  const renderCollapsible = ({ sectionKey, label, troops, isTier }) => {
    const isOn  = isTier ? tierOn[sectionKey] : true;
    const isExp = expanded[sectionKey];
    const borderOn  = "#94a3b8";
    const borderOff = "#e2e8f0";
    return (
      <div key={sectionKey} style={{ flex:1, minWidth:0 }}>
        <div
          onClick={() => toggleExpand(sectionKey)}
          style={{ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", backgroundColor: isOn ? "#f1f5f9" : "#f8fafc", borderRadius: isExp ? "10px 10px 0 0" : 10, border:`1.5px solid ${isOn ? borderOn : borderOff}`, cursor:"pointer", userSelect:"none", transition:"all 0.12s" }}
        >
          {isTier && <ToggleSwitch on={isOn} onClick={e => { e.stopPropagation(); toggleTier(sectionKey); }} />}
          <span style={{ fontSize:13, fontWeight:800, color: isOn ? DARK : "#94a3b8", fontFamily:"'DM Mono',monospace", flex:1 }}>{label}</span>
          <span style={{ color:"#94a3b8", fontSize:11, display:"inline-block", transform: isExp ? "rotate(180deg)" : "none", transition:"transform 0.15s" }}>▾</span>
        </div>
        {isExp && (
          <div style={{ border:`1.5px solid ${isOn ? borderOn : borderOff}`, borderTop:"none", borderRadius:"0 0 10px 10px", backgroundColor:"#fff", overflow:"hidden" }}>
            {troops.map((name, i) => {
              const tOn = troopOn[name] !== false;
              const qty  = troopQty[name];
              const active = (isTier ? isOn : true) && tOn;
              return (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", borderBottom: i<troops.length-1 ? "1px solid #f8fafc" : "none", opacity: active ? 1 : 0.35 }}>
                  <TroopCheck on={active} onClick={() => toggleTroop(name)} />
                  <span style={{ flex:1, fontSize:12, fontWeight:600, color:DARK }}>{name}</span>
                  {qty !== undefined
                    ? <span style={{ fontSize:13, fontWeight:700, color:DARK, fontFamily:"'DM Mono',monospace" }}>{qty.toLocaleString()}</span>
                    : <span style={{ fontSize:11, color:"#cbd5e1" }}>—</span>
                  }
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  // ── Flat results section (post-calculate) ──
  const renderResults = () => {
    const resultSection = (label, color, border, troops, getQty, isActive) => {
      if (!troops.length) return null;
      return (
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:11, fontWeight:700, color, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>{label}</div>
          <div style={{ backgroundColor:"#fff", borderRadius:12, border:`1.5px solid ${border}`, overflow:"hidden" }}>
            {troops.map((name, i) => {
              const active = isActive(name);
              const qty    = active ? (getQty(name) || 0) : 0;
              return (
                <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 14px", borderBottom: i<troops.length-1 ? "1px solid #f1f5f9" : "none", opacity: active ? 1 : 0.35 }}>
                  <span style={{ fontSize:13, fontWeight:600, color:"#1e293b" }}>{name}</span>
                  <span style={{ fontSize:14, fontWeight:700, color: active && qty > 0 ? "#1e293b" : "#94a3b8", fontFamily:"'DM Mono',monospace" }}>{qty.toLocaleString()}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    return (
      <div style={{ marginTop:8 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <span style={{ fontSize:12, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.08em" }}>Results</span>
          <button onClick={copyToClipboard} style={{ display:"flex", alignItems:"center", gap:6, padding:"8px 14px", borderRadius:8, border:"1.5px solid #e2e8f0", backgroundColor: copied ? "#f0fdf4" : "#fff", fontSize:12, fontWeight:700, color: copied ? "#16a34a" : "#1e293b", cursor:"pointer" }}>
            <Icon name="copy" size={14} color={copied ? "#16a34a" : "#1e293b"}/>
            {copied ? "Copied!" : "Copy"}
          </button>
        </div>

        {/* Export */}
        <div style={{ backgroundColor:"#fff", borderRadius:12, border:"1.5px solid #e2e8f0", padding:"14px", marginBottom:16 }}>
          <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:10 }}>Export</div>
          <div style={{ marginBottom:10 }}>
            <input type="email" inputMode="email" placeholder="your@email.com" value={email} onChange={e => saveEmail(e.target.value)}
              style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e2e8f0", borderRadius:10, fontSize:14, color:"#1e293b", backgroundColor:"#f8fafc" }}
            />
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={downloadCSV} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:6, padding:"11px 0", borderRadius:10, border:"1.5px solid #e2e8f0", backgroundColor:"#f8fafc", fontSize:13, fontWeight:700, color:"#1e293b", cursor:"pointer" }}>
              <Icon name="download" size={16} color="#1e293b"/> Download CSV
            </button>
            <button onClick={openEmail} disabled={!email.trim()} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:6, padding:"11px 0", borderRadius:10, border:"none", backgroundColor: email.trim() ? "#1e293b" : "#94a3b8", fontSize:13, fontWeight:700, color:"#fff", cursor: email.trim() ? "pointer" : "default" }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              Email results
            </button>
          </div>
          {!email.trim() && <div style={{ fontSize:11, color:"#94a3b8", marginTop:6, textAlign:"center" }}>Enter an email to enable email button</div>}
        </div>

        {(() => {
          // Flat results: Mercs → Monsters → Guards in sheet order
          const ROSTER_SET = new Set([...Object.values(ROSTER).flat()]);
          const flatSection = (label, items) => {
            if (!items.length) return null;
            return (
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>{label}</div>
                <div style={{ backgroundColor:"#fff", borderRadius:12, border:"1.5px solid #e2e8f0", overflow:"hidden" }}>
                  {items.map((t, i) => {
                    const q = t.qty || 0;
                    return (
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 14px", borderBottom: i<items.length-1 ? "1px solid #f1f5f9" : "none", opacity: q > 0 ? 1 : 0.35 }}>
                        <span style={{ fontSize:13, fontWeight:600, color:"#1e293b" }}>{t.name}</span>
                        <span style={{ fontSize:14, fontWeight:700, color: q > 0 ? "#1e293b" : "#94a3b8", fontFamily:"'DM Mono',monospace" }}>{q.toLocaleString()}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          };
          // Mercs: ROSTER order, 0 if toggled off
          // Use sheet order from API (Grim Stalker last); supplement toggled-off mercs with qty 0
          const apiMercSet = new Set(resultOrder.mercs.map(t => t.name));
          const mercItems = [
            ...resultOrder.mercs,
            ...ROSTER.MERCS.filter(n => !apiMercSet.has(n)).map(n => ({ name:n, qty:0 }))
          ];
          // Guards/Monsters: API order, no filter — show everything returned
          const monsterItems = resultOrder.monsters;
          const guardItems   = resultOrder.guards;
          return (<>
            {flatSection("Mercs", mercItems)}
            {flatSection("Monsters", monsterItems)}
            {flatSection("Guards", guardItems)}
          </>);
        })()}
      </div>
    );
  };

  return (
    <div style={{ padding:"16px 16px 32px" }}>

      {!stackEnabled() && (
        <div style={{ backgroundColor:"#fef3c7", border:"1.5px solid #fbbf24", borderRadius:12, padding:"14px 16px", marginBottom:18 }}>
          <div style={{ fontSize:13, fontWeight:700, color:"#92400e", marginBottom:4 }}>Stack Calculator not configured</div>
          <div style={{ fontSize:12, color:"#92400e", lineHeight:1.5 }}>Deploy AppScript_StackCalc.gs as a Web App, then paste the /exec URL into STACK_URL.</div>
        </div>
      )}

      {/* LAD inputs */}
      <div style={{ marginBottom:18 }}>
        <SecHeader title="Leadership / Authority / Dominance"/>
        <div style={{ display:"flex", gap:10 }}>
          {ladField("leadership","Leadership")}
          {ladField("authority","Authority")}
          {ladField("dominance","Dominance")}
        </div>
      </div>

      {error && <div style={{ backgroundColor:"#fef2f2", border:"1.5px solid #fca5a5", borderRadius:12, padding:"12px 16px", marginBottom:16, fontSize:13, color:"#dc2626", fontWeight:600 }}>{error}</div>}

      {/* Troop selection */}
      <div style={{ marginBottom:16 }}>
        <SecHeader title="Troop Selection"/>
        {/* Tier pairs side-by-side: G9/G8, S9/S8, E9/E8, M9/M8, M7, then Mercs */}
        {TIER_PAIRS.map((pair, pi) => (
          <div key={pi} style={{ display:"flex", gap:8, marginBottom:8 }}>
            {pair.map(key => renderCollapsible({ sectionKey:key, label:key, troops:ROSTER[key]||[], isTier:true }))}
          </div>
        ))}
        {/* Mercs below M7 */}
        {renderCollapsible({ sectionKey:"MERCS", label:"Mercs", troops:ROSTER.MERCS, isTier:false })}
      </div>

      {/* Calculate button — below troop selection */}
      <button onClick={calculate} disabled={loading || !stackEnabled()}
        style={{ width:"100%", padding:"14px 0", borderRadius:12, border:"none", backgroundColor: loading || !stackEnabled() ? "#94a3b8" : "#1e293b", color:"#fff", fontSize:15, fontWeight:700, cursor: loading || !stackEnabled() ? "default" : "pointer", marginBottom:20, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}
      >
        {loading
          ? <><div style={{ width:16, height:16, border:"2.5px solid #ffffff66", borderTopColor:"#fff", borderRadius:8, animation:"spin 0.7s linear infinite" }}/> Calculating…</>
          : <><Icon name="calc" size={18} color="#fff"/> Calculate Stack</>
        }
      </button>

      {/* Flat results */}
      {calculated && renderResults()}
    </div>
  );
};

// ─── APP SHELL ────────────────────────────────────────────────────────────────
const App = () => (
  <div style={{ maxWidth:480, margin:"0 auto", minHeight:"100vh", display:"flex", flexDirection:"column", backgroundColor:"#f8fafc" }}>
    <div style={{ padding:"16px 16px 12px", backgroundColor:"#fff", borderBottom:"1px solid #f1f5f9", position:"sticky", top:0, zIndex:50 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <div style={{ width:32, height:32, borderRadius:8, backgroundColor:"#1e293b", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Icon name="blueprint" size={16} color="#60a5fa"/>
          </div>
          <span style={{ fontSize:11, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.12em", fontFamily:"'DM Mono',monospace" }}>Blueprint</span>
        </div>
        <button onClick={() => alert("Sign-in coming soon.")} style={{ display:"flex", alignItems:"center", gap:6, padding:"6px 14px", borderRadius:8, border:"1.5px solid #e2e8f0", backgroundColor:"#f8fafc", fontSize:12, fontWeight:700, color:"#1e293b", cursor:"pointer" }}>
          <Icon name="user" size={13} color="#1e293b"/> Sign in
        </button>
      </div>
      <div style={{ display:"flex", gap:4 }}>
        <div style={{ padding:"6px 14px", borderRadius:8, backgroundColor:"#1e293b", fontSize:12, fontWeight:700, color:"#fff" }}>Stack Calculator</div>
      </div>
    </div>
    <div style={{ flex:1 }}><StackCalcScreen/></div>
  </div>
);

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>

<!-- Blueprint Stack Calculator v5 — 2026-09-27 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Blueprint — Stack Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600;700&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f8fafc; font-family: 'DM Sans', sans-serif; -webkit-text-size-adjust: 100%; }
    #root { min-height: 100%; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js?v=5"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const STACK_URL = "https://script.google.com/macros/s/AKfycbzuFNRBcBWmGjqDBP_WBoMuOHPZN3qkkKH67_DhCtYR7zSlj-fmhHSJkAoMH6hG6X39/exec";
const stackEnabled = () => STACK_URL && !STACK_URL.startsWith("YOUR_");

// ─── HARDCODED ROSTER ─────────────────────────────────────────────────────────
const ROSTER = {
  G9: ["Punisher II", "Purifier II", "Smiter II", "Corax II"],
  G8: ["Punisher I",  "Purifier I",  "Smiter I",  "Corax I"],
  S9: ["Duelist II",  "Legitimist II",  "Whitemane II",  "Royal Lion II"],
  S8: ["Duelist I",   "Legitimist I",   "Whitemain I",   "Royal Lion I"],
  E9: ["Cannon II"],
  E8: ["Cannon I"],
  M9: ["Trickster II", "Fire Phoenix II", "Kraken II"],
  M8: ["Trickster I",  "Devastator I",    "Fire Phoenix I", "Kraken I", "Devastator II"],
  M7: ["Ancient Terror", "Black Dragon", "Destructive Colossus", "Wind Lord"],
  MERCS: [
    "Grim Stalker Leader", "Wasp-Man Leader", "Highlander", "Slavic warrior",
    "Pounder", "Scarface", "Chitinous Defnder Leader", "Combat Anreater Leader",
    "Quicksand", "Galloper", "Superior Epic Monster Hunter", "Elder Frozen Warden",
    "Elder Bounty Hunter", "Ariel", "Warregal", "Jago",
    "Demonic Salamander", "Eternal Cannoneer", "Warden", "Wyvern",
  ],
};

// ─── TIER DEFINITIONS ─────────────────────────────────────────────────────────
const TIER_DEFS = [
  { key:"G9", color:"#166534", bg:"#f0fdf4", border:"#16a34a" },
  { key:"G8", color:"#166534", bg:"#f0fdf4", border:"#16a34a" },
  { key:"S9", color:"#1e40af", bg:"#eff6ff", border:"#3b82f6" },
  { key:"S8", color:"#1e40af", bg:"#eff6ff", border:"#3b82f6" },
  { key:"E9", color:"#6b21a8", bg:"#faf5ff", border:"#a855f7" },
  { key:"E8", color:"#6b21a8", bg:"#faf5ff", border:"#a855f7" },
  { key:"M9", color:"#92400e", bg:"#fffbeb", border:"#d97706" },
  { key:"M8", color:"#92400e", bg:"#fffbeb", border:"#d97706" },
  { key:"M7", color:"#92400e", bg:"#fffbeb", border:"#d97706" },
];
const TIER_MAP = Object.fromEntries(TIER_DEFS.map(d => [d.key, d]));

// All troop names (for initialising toggles)
const ALL_TROOPS = [...Object.values(ROSTER).flat()];

// ─── ICONS ────────────────────────────────────────────────────────────────────
const Icon = ({ name, size=22, color="currentColor" }) => {
  const s = { width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:color, strokeWidth:"2", strokeLinecap:"round", strokeLinejoin:"round" };
  const icons = {
    calc:      <svg {...s}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>,
    copy:      <svg {...s}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
    download:  <svg {...s}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    user:      <svg {...s}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    blueprint: <svg {...s}><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/></svg>,
  };
  return icons[name] || null;
};

const SecHeader = ({ title, action }) => (
  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
    <span style={{ fontSize:12, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.08em" }}>{title}</span>
    {action}
  </div>
);

// ─── TOGGLE SWITCH ────────────────────────────────────────────────────────────
const ToggleSwitch = ({ on, onColor="#3b82f6", onClick }) => (
  <button onClick={onClick} style={{ width:36, height:20, borderRadius:10, border:"none", cursor:"pointer", flexShrink:0, backgroundColor: on ? onColor : "#cbd5e1", position:"relative", padding:0, transition:"background 0.15s" }}>
    <div style={{ width:14, height:14, borderRadius:7, backgroundColor:"#fff", position:"absolute", top:3, left: on ? 19 : 3, transition:"left 0.15s", boxShadow:"0 1px 2px rgba(0,0,0,0.2)" }}/>
  </button>
);

// ─── TROOP CHECKBOX ───────────────────────────────────────────────────────────
const TroopCheck = ({ on, accentColor="#3b82f6", onClick }) => (
  <button onClick={onClick} style={{ width:20, height:20, borderRadius:5, flexShrink:0, cursor:"pointer", border:`2px solid ${on ? accentColor : "#cbd5e1"}`, backgroundColor: on ? accentColor + "22" : "#f8fafc", display:"flex", alignItems:"center", justifyContent:"center" }}>
    {on && <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke={accentColor} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
  </button>
);

// ─── STACK CALCULATOR ─────────────────────────────────────────────────────────
const StackCalcScreen = () => {
  const [lad,      setLad]      = useState({ leadership:"", authority:"", dominance:"" });
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);
  const [copied,   setCopied]   = useState(false);
  const [troopQty, setTroopQty] = useState({});   // populated after Calculate

  // Toggle state — initialised from roster, persists across Calculate calls
  const [tierOn,   setTierOn]   = useState(() => Object.fromEntries(TIER_DEFS.map(d => [d.key, true])));
  const [troopOn,  setTroopOn]  = useState(() => Object.fromEntries(ALL_TROOPS.map(n => [n, true])));
  const [expanded, setExpanded] = useState({});   // all collapsed by default

  const [email, setEmail] = useState(() => {
    try { return localStorage.getItem("blueprint_stack_email") || ""; } catch { return ""; }
  });

  const calculated = Object.keys(troopQty).length > 0;

  // ── Toggles ──
  const toggleTier = (key) => {
    const newVal = !tierOn[key];
    setTierOn(t => ({ ...t, [key]: newVal }));
    setTroopOn(tr => {
      const next = { ...tr };
      (ROSTER[key] || []).forEach(n => { next[n] = newVal; });
      return next;
    });
  };

  const toggleTroop  = (name) => setTroopOn(tr => ({ ...tr, [name]: !tr[name] }));
  const toggleExpand = (key)  => setExpanded(e  => ({ ...e,  [key]: !e[key]  }));

  // ── Calculate ──
  const calculate = async () => {
    if (!stackEnabled()) return;
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(STACK_URL, {
        method:"POST", headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({
          leadership: Number(lad.leadership) || 0,
          authority:  Number(lad.authority)  || 0,
          dominance:  Number(lad.dominance)  || 0,
        }),
        redirect:"follow",
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      // Map quantities by troop name
      const qty = {};
      (data.stack?.mercs    || []).forEach(t => { qty[t.name] = t.qty; });
      (data.stack?.guards   || []).forEach(t => { qty[t.name] = t.qty; });
      (data.stack?.monsters || []).forEach(t => { qty[t.name] = t.qty; });
      setTroopQty(qty);
      requestAnimationFrame(() => window.scrollTo({ top:0, behavior:"smooth" }));
    } catch (err) {
      setError(err.message || "Could not reach the calculator. Check the URL and try again.");
    } finally {
      setLoading(false);
    }
  };

  // ── Effective troops (toggled on + have a quantity) ──
  const effectiveMercs = () =>
    ROSTER.MERCS.filter(n => troopOn[n] && troopQty[n] > 0).map(n => ({ name:n, qty:troopQty[n] }));

  const effectiveTier = (key) =>
    (ROSTER[key] || []).filter(n => tierOn[key] && troopOn[n] && troopQty[n] > 0).map(n => ({ name:n, qty:troopQty[n] }));

  const totalActive = () => {
    const mercs = ROSTER.MERCS.filter(n => troopOn[n] && troopQty[n] > 0).length;
    const tiers  = TIER_DEFS.reduce((acc, {key}) => acc + effectiveTier(key).length, 0);
    return mercs + tiers;
  };

  // ── Copy ──
  const copyToClipboard = () => {
    if (!calculated) return;
    const lines = [];
    const em = effectiveMercs();
    if (em.length) { lines.push("MERCS"); em.forEach(t => lines.push(`  ${t.name}: ${t.qty.toLocaleString()}`)); }
    TIER_DEFS.forEach(({key}) => {
      const et = effectiveTier(key);
      if (et.length) { lines.push(key); et.forEach(t => lines.push(`  ${t.name}: ${t.qty.toLocaleString()}`)); }
    });
    const text = lines.join("\n");
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2500); };
    if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(done); }
    else { const el = document.createElement("textarea"); el.value=text; document.body.appendChild(el); el.select(); document.execCommand("copy"); document.body.removeChild(el); done(); }
  };

  // ── Download CSV ──
  const downloadCSV = () => {
    if (!calculated) return;
    const rows = [["Group","Name","Quantity"]];
    effectiveMercs().forEach(t => rows.push(["Mercs", t.name, t.qty]));
    TIER_DEFS.forEach(({key}) => effectiveTier(key).forEach(t => rows.push([key, t.name, t.qty])));
    const csv  = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type:"text/csv" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a"); a.href=url; a.download=`stack_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  // ── Email ──
  const saveEmail = v => { setEmail(v); try { localStorage.setItem("blueprint_stack_email", v); } catch {} };
  const openEmail = () => {
    if (!calculated) return;
    const lines = [];
    effectiveMercs().forEach(t => lines.push(`${t.name}: ${t.qty.toLocaleString()}`));
    TIER_DEFS.forEach(({key}) => effectiveTier(key).forEach(t => lines.push(`[${key}] ${t.name}: ${t.qty.toLocaleString()}`)));
    const subject = encodeURIComponent(`Stack Calculator Results — ${new Date().toLocaleDateString()}`);
    window.location.href = `mailto:${encodeURIComponent(email.trim())}?subject=${subject}&body=${encodeURIComponent(lines.join("\n"))}`;
  };

  // ── LAD field ──
  const ladField = (key, label) => (
    <div key={key} style={{ flex:1 }}>
      <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:4 }}>{label}</div>
      <input type="number" inputMode="numeric" placeholder="0" value={lad[key]}
        onChange={e => setLad(l => ({ ...l, [key]: e.target.value }))}
        style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e2e8f0", borderRadius:10, fontSize:15, fontWeight:600, fontFamily:"'DM Mono',monospace", color:"#1e293b", backgroundColor:"#fff", textAlign:"right" }}
      />
    </div>
  );

  // ── Collapsible section renderer (used for both tiers and mercs) ──
  const renderSection = ({ sectionKey, label, def, troops, isTier }) => {
    const isOn  = isTier ? tierOn[sectionKey] : true;
    const isExp = expanded[sectionKey];
    const borderColor = def ? (isOn ? def.border : "#e2e8f0") : "#e2e8f0";
    const bgColor     = def ? (isOn ? def.bg    : "#f8fafc") : "#f8fafc";
    const labelColor  = def ? (isOn ? def.color : "#94a3b8") : "#7c3aed";
    const checkColor  = def ? def.border : "#8b5cf6";

    return (
      <div key={sectionKey} style={{ marginBottom:8 }}>
        {/* Header */}
        <div
          onClick={() => toggleExpand(sectionKey)}
          style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", backgroundColor: bgColor, borderRadius: isExp ? "10px 10px 0 0" : 10, border:`1.5px solid ${borderColor}`, cursor:"pointer", userSelect:"none", transition:"background 0.15s" }}
        >
          {isTier && (
            <ToggleSwitch on={isOn} onColor={def.border}
              onClick={e => { e.stopPropagation(); toggleTier(sectionKey); }}
            />
          )}
          <span style={{ fontSize:14, fontWeight:800, color: labelColor, fontFamily:"'DM Mono',monospace", minWidth:32 }}>{label}</span>
          <span style={{ flex:1, fontSize:12, color:"#94a3b8" }}>{troops.length} troop{troops.length !== 1 ? "s" : ""}</span>
          <span style={{ color:"#94a3b8", fontSize:11, display:"inline-block", transform: isExp ? "rotate(180deg)" : "none", transition:"transform 0.15s" }}>▾</span>
        </div>

        {/* Troop list */}
        {isExp && (
          <div style={{ border:`1.5px solid ${borderColor}`, borderTop:"none", borderRadius:"0 0 10px 10px", overflow:"hidden", backgroundColor:"#fff" }}>
            {troops.map((name, i) => {
              const tOn = troopOn[name] !== false;
              const qty  = troopQty[name];
              const active = (isTier ? isOn : true) && tOn;
              return (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderBottom: i < troops.length-1 ? "1px solid #f1f5f9" : "none", opacity: active ? 1 : 0.38, transition:"opacity 0.15s" }}>
                  <TroopCheck on={active} accentColor={checkColor} onClick={() => toggleTroop(name)} />
                  <span style={{ flex:1, fontSize:13, fontWeight:600, color:"#1e293b" }}>{name}</span>
                  {qty !== undefined
                    ? <span style={{ fontSize:14, fontWeight:700, color:"#1e293b", fontFamily:"'DM Mono',monospace" }}>{qty.toLocaleString()}</span>
                    : <span style={{ fontSize:12, color:"#cbd5e1", fontFamily:"'DM Mono',monospace" }}>—</span>
                  }
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  const active = calculated ? totalActive() : null;

  return (
    <div style={{ padding:"16px 16px 32px" }}>

      {!stackEnabled() && (
        <div style={{ backgroundColor:"#fef3c7", border:"1.5px solid #fbbf24", borderRadius:12, padding:"14px 16px", marginBottom:18 }}>
          <div style={{ fontSize:13, fontWeight:700, color:"#92400e", marginBottom:4 }}>Stack Calculator not configured</div>
          <div style={{ fontSize:12, color:"#92400e", lineHeight:1.5 }}>Deploy AppScript_StackCalc.gs as a Web App, then paste the /exec URL into STACK_URL.</div>
        </div>
      )}

      {/* LAD inputs */}
      <div style={{ marginBottom:18 }}>
        <SecHeader title="Leadership / Authority / Dominance"/>
        <div style={{ display:"flex", gap:10 }}>
          {ladField("leadership","Leadership")}
          {ladField("authority","Authority")}
          {ladField("dominance","Dominance")}
        </div>
      </div>

      {/* Calculate button */}
      <button
        onClick={calculate} disabled={loading || !stackEnabled()}
        style={{ width:"100%", padding:"14px 0", borderRadius:12, border:"none", backgroundColor: loading || !stackEnabled() ? "#94a3b8" : "#1e293b", color:"#fff", fontSize:15, fontWeight:700, cursor: loading || !stackEnabled() ? "default" : "pointer", marginBottom:20, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}
      >
        {loading
          ? <><div style={{ width:16, height:16, border:"2.5px solid #ffffff66", borderTopColor:"#fff", borderRadius:8, animation:"spin 0.7s linear infinite" }}/> Calculating…</>
          : <><Icon name="calc" size={18} color="#fff"/> Calculate Stack</>
        }
      </button>

      {/* Error */}
      {error && (
        <div style={{ backgroundColor:"#fef2f2", border:"1.5px solid #fca5a5", borderRadius:12, padding:"12px 16px", marginBottom:16, fontSize:13, color:"#dc2626", fontWeight:600 }}>{error}</div>
      )}

      {/* Post-calculate header + export */}
      {calculated && (
        <div>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
            <span style={{ fontSize:12, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.08em" }}>
              {active} active troop type{active !== 1 ? "s" : ""}
            </span>
            <button onClick={copyToClipboard} style={{ display:"flex", alignItems:"center", gap:6, padding:"8px 14px", borderRadius:8, border:"1.5px solid #e2e8f0", backgroundColor: copied ? "#f0fdf4" : "#fff", fontSize:12, fontWeight:700, color: copied ? "#16a34a" : "#1e293b", cursor:"pointer" }}>
              <Icon name="copy" size={14} color={copied ? "#16a34a" : "#1e293b"}/>
              {copied ? "Copied!" : "Copy"}
            </button>
          </div>
          <div style={{ backgroundColor:"#fff", borderRadius:12, border:"1.5px solid #e2e8f0", padding:"14px", marginBottom:16 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:10 }}>Export results</div>
            <div style={{ marginBottom:10 }}>
              <input type="email" inputMode="email" placeholder="your@email.com" value={email} onChange={e => saveEmail(e.target.value)}
                style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e2e8f0", borderRadius:10, fontSize:14, color:"#1e293b", backgroundColor:"#f8fafc" }}
              />
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={downloadCSV} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:6, padding:"11px 0", borderRadius:10, border:"1.5px solid #e2e8f0", backgroundColor:"#f8fafc", fontSize:13, fontWeight:700, color:"#1e293b", cursor:"pointer" }}>
                <Icon name="download" size={16} color="#1e293b"/> Download CSV
              </button>
              <button onClick={openEmail} disabled={!email.trim()} style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:6, padding:"11px 0", borderRadius:10, border:"none", backgroundColor: email.trim() ? "#1e293b" : "#94a3b8", fontSize:13, fontWeight:700, color:"#fff", cursor: email.trim() ? "pointer" : "default" }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Email results
              </button>
            </div>
            {!email.trim() && <div style={{ fontSize:11, color:"#94a3b8", marginTop:6, textAlign:"center" }}>Enter an email address to enable the email button</div>}
          </div>
        </div>
      )}

      {/* Mercs section */}
      {renderSection({ sectionKey:"MERCS", label:"Mercs", def:null, troops:ROSTER.MERCS, isTier:false })}

      {/* Tier sections */}
      {TIER_DEFS.map(def =>
        renderSection({ sectionKey:def.key, label:def.key, def, troops:ROSTER[def.key] || [], isTier:true })
      )}
    </div>
  );
};

// ─── APP SHELL ────────────────────────────────────────────────────────────────
const App = () => (
  <div style={{ maxWidth:480, margin:"0 auto", minHeight:"100vh", display:"flex", flexDirection:"column", backgroundColor:"#f8fafc" }}>
    <div style={{ padding:"16px 16px 12px", backgroundColor:"#fff", borderBottom:"1px solid #f1f5f9", position:"sticky", top:0, zIndex:50 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <div style={{ width:32, height:32, borderRadius:8, backgroundColor:"#1e293b", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Icon name="blueprint" size={16} color="#60a5fa"/>
          </div>
          <span style={{ fontSize:11, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:"0.12em", fontFamily:"'DM Mono',monospace" }}>Blueprint</span>
        </div>
        <button
          onClick={() => alert("Sign-in coming soon.\nYour stacks will be saved to your account once this is set up.")}
          style={{ display:"flex", alignItems:"center", gap:6, padding:"6px 14px", borderRadius:8, border:"1.5px solid #e2e8f0", backgroundColor:"#f8fafc", fontSize:12, fontWeight:700, color:"#1e293b", cursor:"pointer" }}
        >
          <Icon name="user" size={13} color="#1e293b"/> Sign in
        </button>
      </div>
      <div style={{ display:"flex", gap:4 }}>
        <div style={{ padding:"6px 14px", borderRadius:8, backgroundColor:"#1e293b", fontSize:12, fontWeight:700, color:"#fff" }}>Stack Calculator</div>
      </div>
    </div>
    <div style={{ flex:1 }}><StackCalcScreen/></div>
  </div>
);
